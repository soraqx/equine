<form class="registration-form" id="registerForm">
    <div class="registration-form__group">
        <label for="regName" class="registration-form__label">Full Name</label>
        <input type="text" id="regName" name="name" class="registration-form__input" required>
    </div>
    <div class="registration-form__group">
        <label for="regEmail" class="registration-form__label">Email Address</label>
        <input type="email" id="regEmail" name="email" class="registration-form__input" required>
    </div>
    <button type="submit" class="btn-primary registration-form__submit">Register</button>
    <p class="registration-form__message" id="regMessage"></p>
</form>
